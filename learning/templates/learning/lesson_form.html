{% extends "learning/base.html" %}

{% block title %}{{ title }} - {{ course.title }} - EduPlatform{% endblock %}

{% block content %}
  <h1 class="h4 mb-3">{{ title }} - {{ course.title }}</h1>
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{% url 'learning:course_edit' course.slug %}" class="btn btn-link">Batal</a>
      </form>
    </div>
  </div>
{% endblock %}
