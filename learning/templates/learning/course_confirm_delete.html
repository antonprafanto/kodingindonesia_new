{% extends "learning/base.html" %}

{% block title %}Hapus Kursus - {{ course.title }}{% endblock %}

{% block content %}
  <h1 class="h4 mb-3">Hapus Kursus</h1>
  <div class="alert alert-warning">
    Apakah Anda yakin ingin menghapus kursus <strong>{{ course.title }}</strong>? Tindakan ini tidak dapat dibatalkan.
  </div>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Ya, hapus</button>
    <a href="{% url 'learning:instructor_dashboard' %}" class="btn btn-link">Batal</a>
  </form>
{% endblock %}
